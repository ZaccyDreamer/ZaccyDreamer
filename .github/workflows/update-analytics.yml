name: Update GitHub analytics cards

on:
  schedule:
    # Recheck several times a day so GitHub's contribution processing delay
    # does not leave yesterday's data displayed for a full day.
    - cron: "17 */5 * * *"
  push:
    branches: [main]
  issues:
    types: [opened, closed, reopened]
  pull_request:
    types: [opened, closed, reopened, synchronize]
  create:
  workflow_dispatch:

concurrency:
  group: github-analytics
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  analytics:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate analytics cards from GitHub GraphQL
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/generate_analytics.py

      - name: Publish updated SVG cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-analytics/*.svg
          if git diff --cached --quiet; then
            echo "Analytics cards are unchanged."
          else
            git commit -m "chore: update GitHub analytics cards"
            git push
          fi
